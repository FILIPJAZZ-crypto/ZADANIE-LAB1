plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.inf04ui'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.inf04ui'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}


// Compatibility with newer Gradle versions: the old *RuntimeClasspathCopy
// configurations must not be consumable during Android Studio sync.
configurations.configureEach {
    if (name.endsWith('RuntimeClasspathCopy')) {
        canBeConsumed = false
    }
}
